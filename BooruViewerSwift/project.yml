# XcodeGen spec for the native Booru Viewer rewrite.
# Paths are relative to this file (BooruViewerSwift/). Generate with: xcodegen generate
name: BooruViewer
options:
  bundleIdPrefix: com.booru.viewer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BooruViewer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.booru.viewer.swift
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: "Unlock Booru Viewer with Face ID."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BooruViewerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: BooruViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.booru.viewer.swift.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BooruViewer.app/BooruViewer"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Real gestures in the simulator: scrolls the Explore grid and taps a card, so a
  # "the grid stopped scrolling / cards stopped opening" regression fails CI.
  BooruViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: BooruViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.booru.viewer.swift.uitests
        TEST_TARGET_NAME: BooruViewer
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BooruViewer:
    build:
      targets:
        BooruViewer: all
        BooruViewerTests: [test]
        BooruViewerUITests: [test]
    test:
      targets:
        - BooruViewerTests
        - BooruViewerUITests
